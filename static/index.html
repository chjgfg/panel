<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>项目面板</title>
<style>
:root {
  --bg: #16181d; --card: #1e2128; --line: #2c3038;
  --fg: #e6e8eb; --muted: #8b93a1; --accent: #4c8dff;
  /* 表格状态点 + 仪表严重度。--warn 是按 CVD 可分辨性选的：
     深色下 #e3b341 与 #f85149 的 deutan ΔE 12.3，浅色下 #bf8700 与 #cf222e 为 11.0，
     都过了 8 这条线（#d29922 只有 5.8，红黄在红绿色盲眼里会糊成一片）。 */
  --on: #3fb950; --off: #6e7681; --bad: #f85149; --warn: #e3b341;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --card: #fff; --line: #e2e5ea;
    --fg: #1b1f24; --muted: #6b7280;
    --on: #1a7f37; --off: #9aa0a6; --bad: #cf222e; --warn: #bf8700;
  }
}
* { box-sizing: border-box; }

/* 必须 !important：浏览器让 hidden 生效靠的是自带样式表里的 [hidden]{display:none}，
   而下面 #login{display:flex} 是作者样式表里的 id 选择器，优先级更高会把它顶掉，
   结果就是 hidden 属性加上了、元素照样显示。 */
[hidden] { display: none !important; }
body {
  margin: 0; padding: 1rem; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, "Microsoft YaHei", sans-serif;
}
h1 { font-size: 1.15rem; margin: 0; }
h2 { font-size: .95rem; margin: 0; }
.err { color: var(--bad); margin: .5rem 0; font-size: .85rem; min-height: 1.2em; }
#tick { color: var(--muted); font-size: .8rem; }

#login { display: flex; min-height: 80vh; align-items: center; justify-content: center; }
#loginForm {
  width: min(320px, 100%); padding: 1.5rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
}
#loginForm h1 { margin-bottom: 1rem; }
input, button, select {
  font: inherit; border-radius: 6px; border: 1px solid var(--line);
}
input, select {
  padding: .45rem .6rem; background: var(--bg); color: var(--fg);
}
#loginForm input { width: 100%; padding: .55rem .7rem; }
button {
  padding: .4rem .75rem; background: var(--accent); color: #fff;
  border-color: transparent; cursor: pointer;
}
#loginForm button { width: 100%; margin-top: .75rem; padding: .55rem; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }

#app { max-width: min(1600px, 96vw); margin: 0 auto; }

/* ---------- 整机资源：一排 stat tile，每个是一个「占比对上限」的仪表 ---------- */
.stats {
  display: grid; gap: .6rem; margin-bottom: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
}
.tile {
  padding: .6rem .7rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
}
.tile b { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); }
/* 数值每 3 秒重绘一次，用等宽数字免得位数变化时左右抖动 */
.tile strong {
  display: block; margin: .15rem 0 .25rem; font-size: 1.25rem; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.tile small { color: var(--muted); font-size: .75rem; }
/* 轨道取填充色的浅一档（同色相），这样整条都在表达状态，而不是一半灰一半彩 */
.meter {
  height: 6px; margin-top: .45rem; border-radius: 3px; overflow: hidden;
  background: var(--line);
  background: color-mix(in oklab, var(--m) 22%, transparent);
}
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--m); }
#app > header {
  display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem;
}
#refresh { margin-left: auto; }
table {
  width: 100%; border-collapse: collapse; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
th, td { padding: .6rem .7rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: .78rem; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
tr.busy { opacity: .5; }
tbody tr { vertical-align: middle; }
td.name { white-space: normal; }
td.name small { display: block; color: var(--muted); font-size: .75rem; }
/* 操作按钮组不用 flex：flex 容器会让这个单元格走自己的垂直对齐通道，
   和同行的普通文字单元格中线对不齐，按钮就上下飘。
   改回行内元素 + vertical-align:middle，按钮和本行文字统一按中线对齐。 */
td.ops { white-space: nowrap; }
td.ops button { margin-right: .4rem; vertical-align: middle; }
td.ops button:last-child { margin-right: 0; }
/* 项目行展开箭头 */
td.name .caret { cursor: pointer; user-select: none; margin-right: .4rem; color: var(--muted); }
td.name .subline { display: block; color: var(--muted); font-size: .75rem; }
/* 项目块：每个项目 = 一张项目行表（放表格里）+ 下方表格外的 bin 独立面板 */
#projList { display: flex; flex-direction: column; gap: .4rem; margin-top: .4rem; }
.proj-block > table { margin: 0; }
/* 主表格（表头 + 每个项目行）列宽统一钉死：table-layout:fixed 让每一列都按下面
   的百分比走，表头和各项目行表格列宽完全一致，绝不因内容长度漂移错位。 */
.stack-table { table-layout: fixed; width: 100%; }
.stack-table th:nth-child(1), .stack-table td:nth-child(1) { width: 30%; }
.stack-table th:nth-child(2), .stack-table td:nth-child(2) { width: 16%; }
.stack-table th:nth-child(3), .stack-table td:nth-child(3) { width: 14%; }
.stack-table th:nth-child(4), .stack-table td:nth-child(4) { width: 10%; }
.stack-table th:nth-child(5), .stack-table td:nth-child(5) { width: 15%; }
.stack-table th:nth-child(6), .stack-table td:nth-child(6) { width: 15%; }
/* bin 独立面板：缩进一点，跟上方项目行区分开；内部列表，行数多时自己滚，不碰外层表格。
   左右两侧 margin 取同一个值，左右留白对称：左侧跟上方父项目容器保持一致的缩进，
   右侧留出一模一样的同等留白，展开/收起时面板始终水平居中，不会左右偏移晃动。 */
.bin-panel {
  margin: .35rem 1.6rem 0 1.6rem;
  border: 1px solid var(--line); border-radius: 8px;
  background: color-mix(in oklab, var(--card) 92%, transparent);
  overflow: auto; max-height: 46vh;
}
.bin-panel table { border: 0; border-radius: 0; }
.bin-panel th { font-size: .72rem; }
.bin-panel td { padding: .4rem .7rem; }
.bin-panel .ops { white-space: nowrap; }
.bin-panel .ops button { padding: .25rem .6rem; font-size: .8rem; }
.dot {
  display: inline-block; width: .6rem; height: .6rem; margin-right: .45rem;
  border-radius: 50%; background: var(--off);
}
.dot.on { background: var(--on); }
.dot.bad { background: var(--bad); }

#projList { margin-top: .4rem; }
/* 运行弹窗：模态遮罩 + 居中卡片，遮罩不拦截点击（点击遮罩不关闭弹窗） */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .45);
}
.modal {
  width: min(520px, 94vw); max-height: 84vh;
  display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; gap: .75rem;
  padding: .9rem 1rem; border-bottom: 1px solid var(--line);
}
.modal-head h2 { margin: 0; font-size: 1rem; }
.modal-head .close-x {
  margin-left: auto; background: transparent; color: var(--muted);
  border: 0; font-size: 1.4rem; line-height: 1; padding: .2rem .5rem;
  cursor: pointer;
}
.modal-head .close-x:hover { color: var(--fg); }
.modal-body { padding: .9rem 1rem; overflow: auto; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: .6rem;
  padding: .8rem 1rem; border-top: 1px solid var(--line);
}
/* 确认弹窗：比运行弹窗窄一点，提示文案略大 */
.modal-sm { width: min(420px, 94vw); }
.confirm-msg { margin: 0; font-size: .92rem; line-height: 1.6; color: var(--fg); }
/* 确定按钮用主色调（默认 button 已是 accent 蓝，这里显式声明语义一致） */
.modal-foot button.primary { background: var(--accent); color: #fff; border-color: transparent; }
/* 运行弹窗内容（单 bin）：bin 名 + 参数文本域，原样透传 */
.run-single { display: flex; flex-direction: column; gap: .5rem; }
.run-bin-name { font-size: .95rem; color: var(--fg); font-weight: 600; }
.run-single textarea.arg { width: 100%; resize: vertical; padding: .5rem .6rem; font-size: .85rem; font-family: inherit; line-height: 1.4; min-height: 6rem; }
#runErr { margin: .5rem 0 0; }
/* 日志弹窗：宽一点；来源下拉放在标题右侧、X 再靠最右 */
.modal-log { width: min(760px, 95vw); }
.modal-head .log-src { display: inline-flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .85rem; }
.modal-head .log-src select { padding: .3rem .5rem; font-size: .85rem; }
/* 每条日志标来源 bin，用不同于正文的 muted 色，一眼分清归属 */
#logBody .src { color: var(--accent); font-weight: 600; }
#logBody {
  margin: 0; height: 58vh; overflow: auto; padding: .7rem;
  background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  /* 不换行：一行日志就是一条记录，折行之后时间戳对不齐，很难扫。
     太长的横向滚动看。 */
  white-space: pre;
}
@media (max-width: 640px) {
  body { padding: .6rem; }
  th, td { padding: .5rem .45rem; font-size: .85rem; }
  th:nth-child(4), td:nth-child(4) { display: none; }
  td.ops button { white-space: normal; }   /* 手机上让按钮可换行，避免顶出横向滚动条 */
}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>项目面板</h1>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button id="loginBtn">登录</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <h1>项目面板</h1>
    <span id="tick"></span>
    <button id="refresh" class="ghost">刷新</button>
    <button id="logout" class="ghost">退出</button>
  </header>

  <p id="banner" class="err" hidden></p>

  <div class="stats" id="stats"></div>

  <table class="stack-table">
    <thead>
      <tr><th>项目</th><th>状态</th><th>运行时长</th><th>CPU</th><th>内存</th><th>操作</th></tr>
    </thead>
  </table>
  <div id="projList"></div>

  <div id="runbox" class="overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>运行 · <span id="runName"></span></h2>
        <button id="closeRunX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="run-single">
          <textarea id="runArgs" class="arg" rows="4" placeholder="启动参数（原样透传，支持多行）\n回车、空格都原样作为参数传过去" spellcheck="false"></textarea>
        </div>
        <p id="runErr" class="err"></p>
      </div>
      <div class="modal-foot">
        <button id="runGo" disabled>运行</button>
        <button id="closeRun" class="ghost cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 确认操作弹窗（停止/重启），与运行弹窗同一套 modal 样式 -->
  <div id="confirmBox" class="overlay" hidden>
    <div class="modal modal-sm">
      <div class="modal-head">
        <h2 id="confirmTitle"></h2>
        <button id="confirmCloseX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <p id="confirmMsg" class="confirm-msg"></p>
      </div>
      <div class="modal-foot">
        <button id="confirmOk" class="primary">确定</button>
        <button id="confirmCancel" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <!-- 日志模态弹窗，与其它弹窗同一套 modal 样式 -->
  <div id="logBox" class="overlay" hidden>
    <div class="modal modal-log">
      <div class="modal-head">
        <h2>日志 · <span id="logName"></span></h2>
        <label class="log-src">来源 <select id="logFilter"></select></label>
        <button id="logCloseX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <pre id="logBody"></pre>
      <div class="modal-foot">
        <button id="logClose" class="ghost">关闭</button>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const POLL = 3000;
let timer = null, logKey = null, runKey = null;

async function req(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('未登录'); }
  if (!r.ok) throw new Error((await r.text()).trim() || 'HTTP ' + r.status);
  return r;
}

function banner(msg) {
  $('banner').textContent = msg || '';
  $('banner').hidden = !msg;
}

function showLogin() {
  clearInterval(timer);
  timer = null;
  logKey = null;
  runKey = null;
  banner('');
  $('logBox').hidden = true;
  $('runbox').hidden = true;
  $('confirmBox').hidden = true;
  $('app').hidden = true;
  $('login').hidden = false;
  $('pw').focus();
}

function showApp() {
  $('login').hidden = true;
  $('app').hidden = false;
  refresh();
  timer ||= setInterval(refresh, POLL);
}

function fmtDur(s) {
  if (s == null) return '—';
  s = Math.floor(s);
  const d = s / 86400 | 0, h = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0;
  return d ? `${d}天 ${h}小时` : h ? `${h}小时 ${m}分` : m ? `${m}分 ${s % 60}秒` : `${s}秒`;
}

function fmtMem(b) {
  if (b == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + u[i];
}

// 项目一级行的聚合内存，统一用 MB 展示（需求：内存单位统一为 MB）。
// 聚合值是若干 bin 内存求和，通常已够大，MB 一档正好，不再自动升 GB。
function fmtMemMB(b) {
  if (b == null) return '—';
  return (b / (1024 * 1024)).toFixed(1) + 'MB';
}

// ---------- 整机资源 ----------

function ratio(used, total) {
  return total > 0 ? (used / total) * 100 : null;
}

/// 仪表填充色按严重度走：正常 → 注意 → 危险。
/// 颜色只是辅助，数值本身就在旁边，所以不靠颜色单独传达信息。
function severity(p) {
  return p >= 90 ? 'var(--bad)' : p >= 70 ? 'var(--warn)' : 'var(--accent)';
}

function tile(label, value, sub, p) {
  const d = document.createElement('div');
  d.className = 'tile';
  const b = document.createElement('b');
  b.textContent = label;
  const v = document.createElement('strong');
  v.textContent = value;
  const s = document.createElement('small');
  s.textContent = sub || '';
  d.append(b, v, s);
  if (p != null) {
    const m = document.createElement('div');
    m.className = 'meter';
    m.style.setProperty('--m', severity(p));
    const i = document.createElement('i');
    i.style.width = Math.min(100, Math.max(0, p)) + '%';
    m.appendChild(i);
    d.appendChild(m);
  }
  return d;
}

function renderHost(h) {
  const t = [
    tile('CPU', h.cpu == null ? '—' : h.cpu.toFixed(1) + '%', `${h.cores} 核`, h.cpu),
  ];
  const mp = ratio(h.mem_used, h.mem_total);
  t.push(tile('内存', mp == null ? '—' : mp.toFixed(0) + '%',
    `${fmtMem(h.mem_used)} / ${fmtMem(h.mem_total)}`, mp));
  for (const d of h.disks) {
    const dp = ratio(d.used, d.total);
    t.push(tile('磁盘 ' + d.mount, dp == null ? '—' : dp.toFixed(0) + '%',
      `${fmtMem(d.used)} / ${fmtMem(d.total)}`, dp));
  }
  if (h.swap_total > 0) {
    const sp = ratio(h.swap_used, h.swap_total);
    t.push(tile('Swap', sp.toFixed(0) + '%',
      `${fmtMem(h.swap_used)} / ${fmtMem(h.swap_total)}`, sp));
  }
  t.push(tile('负载', h.load[0].toFixed(2),
    `5 分 ${h.load[1].toFixed(2)} · 15 分 ${h.load[2].toFixed(2)}`));
  t.push(tile('已开机', fmtDur(h.uptime)));
  $('stats').replaceChildren(...t);
}

// 全程用 textContent 建 DOM，不拼 innerHTML，就不用操心转义
function cell(tr, text) {
  const td = document.createElement('td');
  td.textContent = text;
  tr.appendChild(td);
  return td;
}

function btn(ops, label, disabled, onclick, ghost) {
  const b = document.createElement('button');
  b.textContent = label;
  b.disabled = disabled;
  b.onclick = onclick;
  if (ghost) b.className = 'ghost';
  ops.appendChild(b);
}

let lastList = null;              // 最近一次拿到的项目列表，展开/折叠重绘用
const expanded = new Set();       // 已展开（显示 bin 子行）的项目 key

function render(list) {
  lastList = list;
  const frag = document.createDocumentFragment();
  for (const u of list) {
    const block = document.createElement('div');
    block.className = 'proj-block';

    // 项目行：一张自身的表格，行内容保留表格语义（名称/状态/时长/CPU/内存/操作）。
    // 样式类跟表头表格一致，列宽被 table-layout:fixed 钉死，多行永不错位
    const tbl = document.createElement('table');
    tbl.className = 'stack-table';
    const tb = document.createElement('tbody');
    tb.appendChild(projectRow(u));
    tbl.appendChild(tb);
    block.appendChild(tbl);

    // bin 独立面板：在表格之外、项目行下方；只有展开时显示
    if (!u.external) {
      const panel = document.createElement('div');
      panel.className = 'bin-panel';
      panel.hidden = !expanded.has(u.key);
      panel.appendChild(binPanel(u));
      block.appendChild(panel);
    }
    frag.appendChild(block);
  }
  $('projList').replaceChildren(frag);
}

/// 项目一级的行：名称（带展开箭头）、汇总状态、资源、仅【运行…】和【展开/收起】。
/// 停止/重启/日志都在下方独立的 bin 面板里，不在项目行放，避免「点到项目还是点到 bin」混淆。
function projectRow(u) {
  const running = u.active === 'active';
  const outside = u.outside_pid != null;
  const alive = running || outside;
  const tr = document.createElement('tr');

  const name = cell(tr, '');
  name.className = 'name';
  const expandable = !u.external && (u.instances || []).length > 0;
  if (expandable) {
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = expanded.has(u.key) ? '▾' : '▸';
    caret.onclick = toggleExpand;
    name.appendChild(caret);
  }
  name.appendChild(document.createTextNode(u.name));
  const small = document.createElement('small');
  small.classList.add('subline');
  if (outside) {
    small.textContent = `面板外启动 · pid ${u.outside_pid} · 日志看不到`;
  } else if (u.external) {
    small.textContent = u.unit + '（你自己的 service）';
  } else if ((u.running_bins || []).length || u.pid) {
    const parts = [];
    if (u.running_bins && u.running_bins.length) parts.push(`运行 ${u.running_bins.length} 个 bin`);
    if (u.pid) parts.push('pid ' + u.pid);
    small.textContent = parts.join(' · ');
  } else {
    small.textContent = `${(u.bins || []).length} 个可运行程序`;
  }
  name.appendChild(small);

  let statusText;
  if (outside) statusText = '运行中（面板外）';
  else if (!u.loaded) statusText = '未运行';
  else if (running) statusText = '运行中';
  else if (u.active === 'failed') statusText = '失败';
  else statusText = '已停止';
  const st = cell(tr, statusText);
  const dot = document.createElement('span');
  dot.className = 'dot ' + (alive ? 'on' : u.active === 'failed' ? 'bad' : 'off');
  st.prepend(dot);

  cell(tr, fmtDur(u.uptime));
  cell(tr, u.cpu == null ? '—' : u.cpu.toFixed(1) + '%');
  cell(tr, fmtMemMB(u.memory));

  const ops = cell(tr, '');
  ops.className = 'ops';
  if (u.external) {
    // 自写的 unit 没有 bin 面板，对它来说「项目就是这一个 unit」，不存在选择歧义，
    // 启动/停止/重启/日志直接留在项目行
    btn(ops, '启动', false, () => doAction(u, 'start', '启动'));
    btn(ops, '停止', false, () => doAction(u, 'stop', '停止'));
    btn(ops, '重启', false, () => doAction(u, 'restart', '重启'));
    btn(ops, '日志', false, () => openLogs(u), true);
  } else {
    // 普通项目：项目顶层只留「展开/收起」，启动动作下移到 bin 面板各行
    if (expandable) btn(ops, expanded.has(u.key) ? '收起' : '展开', false, toggleExpand);
  }
  return tr;

  // 展开/收起：切换 key 的展开态并整表重绘
  function toggleExpand() {
    expanded.has(u.key) ? expanded.delete(u.key) : expanded.add(u.key);
    if (lastList) render(lastList);
  }
}

/// bin 独立面板内容：一张自己的表，列 = bin/状态/时长/CPU/内存/操作。
/// 每行一个 bin，带独立的停止/重启/日志，只作用于这一个 bin。
function binPanel(u) {
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const htr = document.createElement('tr');
  for (const t of ['bin', '状态', '运行时长', 'CPU', '内存', '操作']) {
    const th = document.createElement('th');
    th.textContent = t;
    htr.appendChild(th);
  }
  thead.appendChild(htr);
  tbl.appendChild(thead);

  const tb = document.createElement('tbody');
  const insts = u.instances || [];
  if (insts.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.textContent = '这个项目没有可运行的 bin';
    tr.appendChild(td);
    tb.appendChild(tr);
    tbl.appendChild(tb);
    return tbl;
  }
  for (const inst of insts) tb.appendChild(binRow(u, inst));
  tbl.appendChild(tb);
  return tbl;
}

/// bin 行：显示该 bin 自己的状态/资源，操作只动这一个 bin
function binRow(u, inst) {
  const tr = document.createElement('tr');

  const name = cell(tr, '');
  name.className = 'name';
  const nm = document.createElement('span');
  nm.textContent = inst.bin;
  const small = document.createElement('small');
  small.classList.add('subline');
  small.textContent = (
    inst.running ? (inst.pid ? `pid ${inst.pid}` : '运行中') :
    inst.active === 'failed' ? '上次失败' : '未运行'
  );
  name.append(nm, small);

  const st = cell(tr, inst.running ? '运行中' : inst.active === 'failed' ? '失败' : '未运行');
  const dot = document.createElement('span');
  dot.className = 'dot ' + (inst.running ? 'on' : inst.active === 'failed' ? 'bad' : 'off');
  st.prepend(dot);

  cell(tr, fmtDur(inst.uptime));
  cell(tr, inst.cpu == null ? '—' : inst.cpu.toFixed(1) + '%');
  cell(tr, fmtMem(inst.memory));

  const ops = cell(tr, '');
  ops.className = 'ops';
  // 四个按钮永远都在，按运行态做可用性控制：
  //   未运行：启动🉑、停止/重启灰；运行中：启动灰、停止/重启🉑；日志恒🉑
  btn(ops, '启动', inst.running, () => openRun(u, inst.bin));
  btn(ops, '停止', !inst.running, () => binAction(u, inst, 'stop'));
  btn(ops, '重启', !inst.running, () => binAction(u, inst, 'restart'));
  btn(ops, '日志', false, () => openLogs(u, inst.bin), true);
  return tr;
}

/// 项目一级的通用操作（外部 unit 的启动/停止/重启），走自定义确认弹窗
function doAction(u, act, label) {
  openConfirm(`确认${label}`, `确认${label}该程序「${u.name}」吗？`, async () => {
    try {
      await req(`/api/units/${u.key}/${act}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      banner('');
    } catch (e) {
      if (e.message !== '未登录') banner(`${label}「${u.name}」失败: ${e.message}`);
    }
    refresh();
  });
}

// ---------- 自定义确认弹窗（替换原生 confirm）----------
let confirmCb = null;

/// 打开确认弹窗：设标题/文案，确定时执行 onOk（可 async），执行完自动关。
/// 关闭仅三种：右上角 X、取消按钮、确定执行完成后。
function openConfirm(title, msg, onOk) {
  confirmCb = onOk;
  $('confirmTitle').textContent = title;
  $('confirmMsg').textContent = msg;
  $('confirmBox').hidden = false;
}
function closeConfirm() {
  confirmCb = null;
  $('confirmBox').hidden = true;
}
$('confirmCloseX').onclick = closeConfirm;      // X 不执行操作
$('confirmCancel').onclick = closeConfirm;      // 取消不执行操作
$('confirmOk').onclick = async () => {          // 确定：执行完毕后关闭
  const cb = confirmCb;
  if (!cb) return closeConfirm();
  await cb();
  closeConfirm();
};

/// 单个 bin 的停止/重启：先弹自定义确认，确定后才执行，只动这一个 bin 的 unit
function binAction(u, inst, act) {
  const label = act === 'stop' ? '停止' : '重启';
  openConfirm(`确认${label}`, `确认${label}该 bin 程序「${inst.bin}」吗？`, async () => {
    try {
      await req(`/api/units/${u.key}/bins/${encodeURIComponent(inst.bin)}/${act}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      banner('');
    } catch (e) {
      if (e.message !== '未登录') banner(`${label}「${inst.bin}」失败: ${e.message}`);
    }
    refresh();
  });
}

// ---------- 选程序（多选，每行独立参数）+ 填参数 ----------

/// 弹窗一次只针对一个 bin：点哪个 bin 的「启动」就弹哪个，只显示它+参数文本域。
let runBin = null;   // 当前弹窗要运行的 bin

function openRun(u, bin) {
  runKey = u.key;
  runBin = bin;
  // 标题跟随点击的 bin 动态变化；弹窗内部只剩参数文本域
  $('runName').textContent = bin;
  $('runArgs').value = '';
  $('runErr').textContent = '';
  $('runGo').disabled = false;
  $('runbox').hidden = false;
  $('runArgs').focus();
}

$('runGo').onclick = async () => {
  if (!runKey || !runBin) return;
  const go = $('runGo');
  go.disabled = true;
  $('runErr').textContent = '';
  try {
    // 只提交当前这个 bin；参数原样透传（空格、换行都不拆）
    await req(`/api/units/${runKey}/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bins: [{ bin: runBin, args: $('runArgs').value }] }),
    });
    // 执行完成自动关闭弹窗
    $('runbox').hidden = true;
    runKey = null; runBin = null;
  } catch (e) {
    if (e.message !== '未登录') $('runErr').textContent = e.message;
  } finally {
    go.disabled = false;
    refresh();
  }
};

// 关闭方式仅三种：右上角 X、取消按钮、点「运行」执行完成后。遮罩点击不关闭。
function closeRunBox() {
  runKey = null;
  runBin = null;
  $('runbox').hidden = true;
  $('runErr').textContent = '';
}
$('closeRunX').onclick = closeRunBox;
$('closeRun').onclick = closeRunBox;

function openLogs(u, preselBin) {
  $('logName').textContent = u.name;
  $('logBox').hidden = false;
  logKey = u.key;
  // 筛选项：全部 + 每个 bin。多 bin 同时跑时能只看某一个，或全部按时间混合看
  const sel = $('logFilter');
  sel.replaceChildren();
  const all = document.createElement('option');
  all.value = '';
  all.textContent = '全部';
  sel.appendChild(all);
  for (const b of u.bins || []) {
    const o = document.createElement('option');
    o.value = b;
    o.textContent = b;
    sel.appendChild(o);
  }
  // 从单个 bin 的日志按钮进来时，自动把筛选切到这个 bin
  if (preselBin && u.bins && u.bins.includes(preselBin)) sel.value = preselBin;
  $('logBody').textContent = '加载中…';
  loadLogs(true);
}

let logCache = null;   // 最近一次拉到的 [{bin, log}]，切筛选时不用重拉

async function loadLogs(jump) {
  if (!logKey) return;
  try {
    logCache = await (await req(`/api/units/${logKey}/logs?lines=300`)).json();
    renderLogs(jump);
  } catch { /* 401 已由 req() 处理 */ }
}

/// 把拉到的各 bin 日志整到一块：全部模式按行首时间戳混合排序、每条标来源 bin；
/// 单 bin 模式只看那一个。用 DOM 文本节点渲染，日志里再怪的字符也不怕被当成 HTML。
function renderLogs(jump) {
  const filter = $('logFilter').value;
  const p = $('logBody');
  // 保持在底部时才跟随滚动（轮询时定位不会被顶到底部打断）
  const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
  p.replaceChildren();
  if (!logCache || logCache.length === 0) {
    p.append('(暂无日志)');
    return;
  }
  // 拆成 (时间戳, 来源, 正文) 三元组
  const rows = [];
  for (const one of logCache) {
    for (const line of (one.log || '').split('\n')) {
      if (line.trim() === '') continue;
      rows.push({ time: line.slice(0, 25), src: one.bin, text: line });
    }
  }
  const keep = filter ? rows.filter(r => r.src === filter) : rows;
  if (keep.length === 0) { p.append('(暂无日志)'); return; }
  // 全部模式按 ISO 时间戳字符串排序（行首都带，字符串序即时间序）；单 bin 模式不用排
  if (!filter) keep.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
  for (const r of keep) {
    const tag = document.createElement('span');
    tag.className = 'src';
    tag.textContent = `[${r.src}] `;
    p.append(tag, document.createTextNode(r.text + '\n'));
  }
  if (jump || atBottom) p.scrollTop = p.scrollHeight;   // 首开/切筛选直接到底；轮询也跟随
}

async function refresh() {
  if (document.hidden) return;   // 后台标签页不用白跑
  try {
    render(await (await req('/api/units')).json());
    $('tick').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    if ($('banner').textContent.startsWith('刷新失败')) banner('');
    await loadLogs(false);
  } catch (e) {
    if (e.message !== '未登录') banner('刷新失败: ' + e.message);
  }
  // 整机资源单独一个 try：读不到（比如不是 Linux）也不该影响项目列表
  try {
    renderHost(await (await req('/api/host')).json());
  } catch { /* 401 已由 req() 处理 */ }
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    });
    if (!r.ok) { $('loginErr').textContent = (await r.text()).trim() || '登录失败'; return; }
    $('pw').value = '';
    showApp();
  } catch {
    $('loginErr').textContent = '连不上服务器';
  } finally {
    $('loginBtn').disabled = false;
  }
};

$('logout').onclick = async () => {
  try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
  showLogin();
};

$('refresh').onclick = () => refresh();

// 切换日志源筛选：用上一次拉到的数据直接重渲染，不用重新请求
$('logFilter').onchange = () => { if (logCache) renderLogs(true); };

// 关闭日志弹窗：清空日志内容，下次再点日志按钮重新拉取
function closeLogBox() {
  logKey = null;
  logCache = null;
  $('logBody').replaceChildren();
  $('logBox').hidden = true;
}
$('logCloseX').onclick = closeLogBox;
$('logClose').onclick = closeLogBox;

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

fetch('/api/me', { credentials: 'same-origin' })
  .then(r => r.ok ? showApp() : showLogin())
  .catch(showLogin);
</script>
</body>
</html>
