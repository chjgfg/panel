<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>项目面板</title>
<!-- CSS/JS 由后端路由提供，内容同样是编译时 include_str! 嵌进二进制的，
     部署仍然只拷一个可执行文件。带版本号是为了升级后浏览器缓存能失效
     （no_cache 中间件已对页面本身禁缓存，这里是双保险）。 -->
<link rel="stylesheet" href="/static/style.css?v=1">
<script>
// 防闪烁：必须在首次渲染前同步执行。
// data-theme: "" / "auto"(跟随系统) / "dark" / "light"。html.light 由主脚本维护。
document.documentElement.dataset.theme = localStorage.getItem('theme') || 'auto';
if (document.documentElement.dataset.theme === 'auto'
    && matchMedia('(prefers-color-scheme: light)').matches) {
  document.documentElement.classList.add('light');
} else if (document.documentElement.dataset.theme === 'light') {
  document.documentElement.classList.add('light');
}
</script>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>项目面板</h1>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button id="loginBtn">登录</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <h1>项目面板</h1>
    <span id="tick"></span>
    <button id="oracleCloud" type="button" class="ghost">Cloud</button>
    <button id="ddia" type="button" class="ghost">设计数据密集型应用</button>
    <button id="themeBtn" type="button" class="chip" title="切换黑夜/白天（跟随系统 → 白天 → 黑夜）">主题</button>
    <button id="refresh" class="chip">刷新</button>
    <button id="logout" class="ghost">退出</button>
  </header>

  <p id="banner" class="err" hidden></p>

  <div class="stats" id="stats"></div>

  <table class="stack-table">
    <thead>
      <tr><th>项目</th><th>状态</th><th>运行时长</th><th>CPU</th><th>内存</th><th>操作</th></tr>
    </thead>
  </table>
  <div id="projList"></div>

  <div id="runbox" class="overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>运行 · <span id="runName"></span></h2>
        <button id="closeRunX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="run-single">
          <textarea id="runArgs" class="arg" rows="4" placeholder="启动参数（原样透传，支持多行）\n回车、空格都原样作为参数传过去" spellcheck="false"></textarea>
        </div>
        <p id="runErr" class="err"></p>
      </div>
      <div class="modal-foot">
        <button id="runGo" class="go-solid" disabled>运行</button>
        <button id="closeRun" class="chip cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 确认操作弹窗（停止/重启），与运行弹窗同一套 modal 样式 -->
  <div id="confirmBox" class="overlay" hidden>
    <div class="modal modal-sm">
      <div class="modal-head">
        <h2 id="confirmTitle"></h2>
        <button id="confirmCloseX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <p id="confirmMsg" class="confirm-msg"></p>
      </div>
      <div class="modal-foot">
        <button id="confirmOk" class="primary">确定</button>
        <button id="confirmCancel" class="chip">取消</button>
      </div>
    </div>
  </div>

  <!-- 日志模态弹窗，与其它弹窗同一套 modal 样式 -->
  <div id="logBox" class="overlay" hidden>
    <div class="modal modal-log">
      <div class="modal-head">
        <h2>日志 · <span id="logName"></span></h2>
        <label class="log-src">来源 <select id="logFilter"></select></label>
        <button id="logCloseX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <pre id="logBody"></pre>
      <div class="modal-foot">
        <button id="logClose" class="chip">关闭</button>
      </div>
    </div>
  </div>
  <!-- 源码模态弹窗：左树右码，复用日志弹窗的宽屏样式 -->
  <div id="srcBox" class="overlay" hidden>
    <div class="modal modal-log">
      <div class="modal-head">
        <h2>源码 · <span id="srcName"></span></h2>
        <button id="srcCloseX" class="close-x" aria-label="关闭" title="关闭">×</button>
      </div>
      <div class="src-layout">
        <nav id="srcTree" aria-label="项目目录"></nav>
        <div id="srcTreeGrip" title="拖拽调整宽度"></div>
        <div class="src-right">
          <div class="src-toolbar">
            <button id="srcTreeToggle" class="chip" title="隐藏/显示目录树">隐藏目录</button>
            <span id="langTag" class="lang-tag" hidden></span>
            <span id="srcPath" class="src-path"></span>
            <button id="srcPull" class="chip">拉取代码</button>
            <button id="srcCopy" class="chip">一键复制</button>
          </div>
          <div id="srcMsg" class="src-msg" hidden></div>
          <pre id="srcBody"></pre>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/vendor/highlight.11.12.0.min.js"></script>
<script src="/static/app.js?v=1"></script>
</body>
</html>
