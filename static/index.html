<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>项目面板</title>
<style>
:root {
  --bg: #16181d; --card: #1e2128; --line: #2c3038;
  --fg: #e6e8eb; --muted: #8b93a1; --accent: #4c8dff;
  /* 表格状态点 + 仪表严重度。--warn 是按 CVD 可分辨性选的：
     深色下 #e3b341 与 #f85149 的 deutan ΔE 12.3，浅色下 #bf8700 与 #cf222e 为 11.0，
     都过了 8 这条线（#d29922 只有 5.8，红黄在红绿色盲眼里会糊成一片）。 */
  --on: #3fb950; --off: #6e7681; --bad: #f85149; --warn: #e3b341;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --card: #fff; --line: #e2e5ea;
    --fg: #1b1f24; --muted: #6b7280;
    --on: #1a7f37; --off: #9aa0a6; --bad: #cf222e; --warn: #bf8700;
  }
}
* { box-sizing: border-box; }

/* 必须 !important：浏览器让 hidden 生效靠的是自带样式表里的 [hidden]{display:none}，
   而下面 #login{display:flex} 是作者样式表里的 id 选择器，优先级更高会把它顶掉，
   结果就是 hidden 属性加上了、元素照样显示。 */
[hidden] { display: none !important; }
body {
  margin: 0; padding: 1rem; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, "Microsoft YaHei", sans-serif;
}
h1 { font-size: 1.15rem; margin: 0; }
h2 { font-size: .95rem; margin: 0; }
.err { color: var(--bad); margin: .5rem 0; font-size: .85rem; min-height: 1.2em; }
#tick { color: var(--muted); font-size: .8rem; }

#login { display: flex; min-height: 80vh; align-items: center; justify-content: center; }
#loginForm {
  width: min(320px, 100%); padding: 1.5rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
}
#loginForm h1 { margin-bottom: 1rem; }
input, button, select {
  font: inherit; border-radius: 6px; border: 1px solid var(--line);
}
input, select {
  padding: .45rem .6rem; background: var(--bg); color: var(--fg);
}
#loginForm input { width: 100%; padding: .55rem .7rem; }
button {
  padding: .4rem .75rem; background: var(--accent); color: #fff;
  border-color: transparent; cursor: pointer;
}
#loginForm button { width: 100%; margin-top: .75rem; padding: .55rem; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }

#app { max-width: min(1600px, 96vw); margin: 0 auto; }

/* ---------- 整机资源：一排 stat tile，每个是一个「占比对上限」的仪表 ---------- */
.stats {
  display: grid; gap: .6rem; margin-bottom: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
}
.tile {
  padding: .6rem .7rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
}
.tile b { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); }
/* 数值每 3 秒重绘一次，用等宽数字免得位数变化时左右抖动 */
.tile strong {
  display: block; margin: .15rem 0 .25rem; font-size: 1.25rem; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.tile small { color: var(--muted); font-size: .75rem; }
/* 轨道取填充色的浅一档（同色相），这样整条都在表达状态，而不是一半灰一半彩 */
.meter {
  height: 6px; margin-top: .45rem; border-radius: 3px; overflow: hidden;
  background: var(--line);
  background: color-mix(in oklab, var(--m) 22%, transparent);
}
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--m); }
#app > header, #logs > header {
  display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem;
}
#logout, #closeLogs { margin-left: auto; }
table {
  width: 100%; border-collapse: collapse; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
th, td { padding: .6rem .7rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .78rem; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
tr.busy { opacity: .5; }
td.name { white-space: normal; }
td.name small { display: block; color: var(--muted); font-size: .75rem; }
/* nowrap 让这一格的最小宽度等于所有按钮之和，表格布局就必须给足空间，
   按钮不会被挤成一竖排。窄屏在下面的 media query 里再放开折行。 */
td.ops { display: flex; flex-wrap: nowrap; gap: .4rem; }
.dot {
  display: inline-block; width: .6rem; height: .6rem; margin-right: .45rem;
  border-radius: 50%; background: var(--off);
}
.dot.on { background: var(--on); }
.dot.bad { background: var(--bad); }

#logs { margin-top: 1.25rem; }
#runbox {
  margin-top: 1.25rem; padding: .9rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
}
#runbox > header { margin-bottom: .75rem; }
.runform { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
.runform label { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .85rem; }
.runform input { min-width: 16rem; flex: 1; }
#runErr { margin-bottom: 0; }
#logBody {
  margin: 0; max-height: 60vh; overflow: auto; padding: .7rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  /* 不换行：一行日志就是一条记录，折行之后时间戳对不齐，很难扫。
     太长的横向滚动看。 */
  white-space: pre;
}
@media (max-width: 640px) {
  body { padding: .6rem; }
  th, td { padding: .5rem .45rem; font-size: .85rem; }
  th:nth-child(4), td:nth-child(4) { display: none; }
  td.ops { flex-wrap: wrap; }   /* 手机上放开折行，否则会顶出横向滚动条 */
}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>项目面板</h1>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button id="loginBtn">登录</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <h1>项目面板</h1>
    <span id="tick"></span>
    <button id="logout" class="ghost">退出</button>
  </header>

  <p id="banner" class="err" hidden></p>

  <div class="stats" id="stats"></div>

  <table>
    <thead>
      <tr><th>项目</th><th>状态</th><th>运行时长</th><th>CPU</th><th>内存</th><th>操作</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <section id="runbox" hidden>
    <header>
      <h2>运行 · <span id="runName"></span></h2>
      <button id="closeRun" class="ghost">取消</button>
    </header>
    <div class="runform">
      <label>程序 <select id="runBin"></select></label>
      <label>参数 <input type="text" id="runArgs" placeholder="可留空，多个参数用空格分隔"></label>
      <button id="runGo">启动</button>
    </div>
    <p id="runErr" class="err"></p>
  </section>

  <section id="logs" hidden>
    <header>
      <h2>日志 · <span id="logName"></span></h2>
      <button id="closeLogs" class="ghost">关闭</button>
    </header>
    <pre id="logBody"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const POLL = 3000;
let timer = null, logKey = null, runKey = null;

async function req(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('未登录'); }
  if (!r.ok) throw new Error((await r.text()).trim() || 'HTTP ' + r.status);
  return r;
}

function banner(msg) {
  $('banner').textContent = msg || '';
  $('banner').hidden = !msg;
}

function showLogin() {
  clearInterval(timer);
  timer = null;
  logKey = null;
  runKey = null;
  banner('');
  $('logs').hidden = true;
  $('runbox').hidden = true;
  $('app').hidden = true;
  $('login').hidden = false;
  $('pw').focus();
}

function showApp() {
  $('login').hidden = true;
  $('app').hidden = false;
  refresh();
  timer ||= setInterval(refresh, POLL);
}

function fmtDur(s) {
  if (s == null) return '—';
  s = Math.floor(s);
  const d = s / 86400 | 0, h = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0;
  return d ? `${d}天 ${h}小时` : h ? `${h}小时 ${m}分` : m ? `${m}分 ${s % 60}秒` : `${s}秒`;
}

function fmtMem(b) {
  if (b == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + u[i];
}

// ---------- 整机资源 ----------

function ratio(used, total) {
  return total > 0 ? (used / total) * 100 : null;
}

/// 仪表填充色按严重度走：正常 → 注意 → 危险。
/// 颜色只是辅助，数值本身就在旁边，所以不靠颜色单独传达信息。
function severity(p) {
  return p >= 90 ? 'var(--bad)' : p >= 70 ? 'var(--warn)' : 'var(--accent)';
}

function tile(label, value, sub, p) {
  const d = document.createElement('div');
  d.className = 'tile';
  const b = document.createElement('b');
  b.textContent = label;
  const v = document.createElement('strong');
  v.textContent = value;
  const s = document.createElement('small');
  s.textContent = sub || '';
  d.append(b, v, s);
  if (p != null) {
    const m = document.createElement('div');
    m.className = 'meter';
    m.style.setProperty('--m', severity(p));
    const i = document.createElement('i');
    i.style.width = Math.min(100, Math.max(0, p)) + '%';
    m.appendChild(i);
    d.appendChild(m);
  }
  return d;
}

function renderHost(h) {
  const t = [
    tile('CPU', h.cpu == null ? '—' : h.cpu.toFixed(1) + '%', `${h.cores} 核`, h.cpu),
  ];
  const mp = ratio(h.mem_used, h.mem_total);
  t.push(tile('内存', mp == null ? '—' : mp.toFixed(0) + '%',
    `${fmtMem(h.mem_used)} / ${fmtMem(h.mem_total)}`, mp));
  for (const d of h.disks) {
    const dp = ratio(d.used, d.total);
    t.push(tile('磁盘 ' + d.mount, dp == null ? '—' : dp.toFixed(0) + '%',
      `${fmtMem(d.used)} / ${fmtMem(d.total)}`, dp));
  }
  if (h.swap_total > 0) {
    const sp = ratio(h.swap_used, h.swap_total);
    t.push(tile('Swap', sp.toFixed(0) + '%',
      `${fmtMem(h.swap_used)} / ${fmtMem(h.swap_total)}`, sp));
  }
  t.push(tile('负载', h.load[0].toFixed(2),
    `5 分 ${h.load[1].toFixed(2)} · 15 分 ${h.load[2].toFixed(2)}`));
  t.push(tile('已开机', fmtDur(h.uptime)));
  $('stats').replaceChildren(...t);
}

// 全程用 textContent 建 DOM，不拼 innerHTML，就不用操心转义
function cell(tr, text) {
  const td = document.createElement('td');
  td.textContent = text;
  tr.appendChild(td);
  return td;
}

function btn(ops, label, disabled, onclick, ghost) {
  const b = document.createElement('button');
  b.textContent = label;
  b.disabled = disabled;
  b.onclick = onclick;
  if (ghost) b.className = 'ghost';
  ops.appendChild(b);
}

function render(list) {
  $('rows').replaceChildren(...list.map(u => {
    const running = u.active === 'active';
    const outside = u.outside_pid != null;      // 面板外启动的裸进程
    const alive = running || outside;
    const tr = document.createElement('tr');

    const name = cell(tr, u.name);
    name.className = 'name';
    const small = document.createElement('small');
    small.textContent = outside
      ? `面板外启动 · pid ${u.outside_pid} · 日志看不到`
      : u.external
        ? u.unit + '（你自己的 service）'
        : [
            u.cur_bin ? '▶ ' + u.cur_bin + (u.cur_args ? ' ' + u.cur_args : '') : null,
            u.pid ? 'pid ' + u.pid : null,
          ].filter(Boolean).join(' · ') || `${u.bins.length} 个可运行程序`;
    small.title = u.unit;     // journalctl -u 用的就是这个名字
    name.appendChild(small);

    const st = cell(tr, outside ? '运行中（面板外）'
      : !u.loaded ? '未运行'
      : running ? '运行中' : u.active === 'failed' ? '失败' : '已停止');
    const dot = document.createElement('span');
    dot.className = 'dot ' + (alive ? 'on' : u.active === 'failed' ? 'bad' : 'off');
    st.prepend(dot);
    st.title = outside ? '这个进程不是面板起的，systemd 不认识它'
                       : `${u.active} / ${u.sub}`;

    cell(tr, fmtDur(u.uptime));
    cell(tr, u.cpu == null ? '—' : u.cpu.toFixed(1) + '%');
    cell(tr, fmtMem(u.memory));

    const ops = cell(tr, '');
    ops.className = 'ops';
    // 按钮一律可点：停止对没在跑的项目是空操作，重启不知道跑哪个 bin 就弹选择框
    if (u.external) {
      // 你自己写的 unit，ExecStart 是你定的，面板不掺和选 bin
      btn(ops, '启动', false, () => doAction(u, 'start', '启动', tr));
    } else {
      btn(ops, outside ? '接管…' : running ? '切换程序…' : '运行…',
          false, () => openRun(u));
    }
    btn(ops, '停止', false, () => doAction(u, 'stop', '停止', tr));
    btn(ops, '重启', false, () => {
      if (!u.external && !u.cur_bin) openRun(u);
      else doAction(u, 'restart', '重启', tr);
    });
    btn(ops, '日志', false, () => openLogs(u), true);

    return tr;
  }));
}

async function doAction(u, act, label, tr) {
  if (!confirm(`确认${label}「${u.name}」?`)) return;
  tr.classList.add('busy');
  tr.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    // 不带 bin，服务端沿用上次那个
    await req(`/api/units/${u.key}/${act}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    banner('');
  } catch (e) {
    if (e.message !== '未登录') banner(`${label}「${u.name}」失败: ${e.message}`);
  }
  refresh();
}

// ---------- 选程序 + 填参数 ----------

function openRun(u) {
  runKey = u.key;
  $('runName').textContent = u.name;
  $('runErr').textContent = '';
  const sel = $('runBin');
  sel.replaceChildren(...u.bins.map(b => {
    const o = document.createElement('option');
    o.value = b;
    o.textContent = b;
    return o;
  }));
  const empty = u.bins.length === 0;
  if (empty) {
    const o = document.createElement('option');
    o.textContent = '没找到 src/main.rs 或 src/bin/*.rs';
    sel.appendChild(o);
  }
  if (u.cur_bin) sel.value = u.cur_bin;
  $('runArgs').value = u.cur_args || '';
  const go = $('runGo');
  go.disabled = empty;
  go.textContent = u.active === 'active' ? '切换并重启' : '启动';
  go.dataset.act = u.active === 'active' ? 'restart' : 'start';
  $('runbox').hidden = false;
  $('runArgs').focus();
}

$('runGo').onclick = async () => {
  if (!runKey) return;
  const go = $('runGo');
  go.disabled = true;
  $('runErr').textContent = '';
  try {
    await req(`/api/units/${runKey}/${go.dataset.act || 'start'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bin: $('runBin').value, args: $('runArgs').value }),
    });
    $('runbox').hidden = true;
    runKey = null;
  } catch (e) {
    if (e.message !== '未登录') $('runErr').textContent = e.message;
  } finally {
    go.disabled = false;
    refresh();
  }
};

$('closeRun').onclick = () => { runKey = null; $('runbox').hidden = true; };

function openLogs(u) {
  $('logName').textContent = u.name;
  $('logs').hidden = false;
  if (u.outside_pid != null) {
    // journald 里没有它的记录，轮询也是白轮，直接说明情况
    logKey = null;
    $('logBody').textContent =
      `这个进程（pid ${u.outside_pid}）是在面板外启动的，输出没有进 journald，面板拿不到。\n\n`
      + `点「接管…」选一个程序重新启动 —— 面板会先停掉它，再用 systemd-run 起一遍，\n`
      + `之后日志就能在这里看了。`;
    return;
  }
  logKey = u.key;
  $('logBody').textContent = '加载中…';
  loadLogs(true);
}

async function loadLogs(jump) {
  if (!logKey) return;
  try {
    const text = await (await req(`/api/units/${logKey}/logs?lines=300`)).text();
    const p = $('logBody');
    const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
    p.textContent = text.trim() || '(暂无日志)';
    if (jump || atBottom) p.scrollTop = p.scrollHeight;   // 只在贴着底部时才跟随
  } catch { /* 401 已由 req() 处理 */ }
}

async function refresh() {
  if (document.hidden) return;   // 后台标签页不用白跑
  try {
    render(await (await req('/api/units')).json());
    $('tick').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    if ($('banner').textContent.startsWith('刷新失败')) banner('');
    await loadLogs(false);
  } catch (e) {
    if (e.message !== '未登录') banner('刷新失败: ' + e.message);
  }
  // 整机资源单独一个 try：读不到（比如不是 Linux）也不该影响项目列表
  try {
    renderHost(await (await req('/api/host')).json());
  } catch { /* 401 已由 req() 处理 */ }
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    });
    if (!r.ok) { $('loginErr').textContent = (await r.text()).trim() || '登录失败'; return; }
    $('pw').value = '';
    showApp();
  } catch {
    $('loginErr').textContent = '连不上服务器';
  } finally {
    $('loginBtn').disabled = false;
  }
};

$('logout').onclick = async () => {
  try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
  showLogin();
};

$('closeLogs').onclick = () => { logKey = null; $('logs').hidden = true; };

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

fetch('/api/me', { credentials: 'same-origin' })
  .then(r => r.ok ? showApp() : showLogin())
  .catch(showLogin);
</script>
</body>
</html>
