<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>项目面板</title>
<style>
:root {
  --bg: #16181d; --card: #1e2128; --line: #2c3038;
  --fg: #e6e8eb; --muted: #8b93a1; --accent: #4c8dff;
  --on: #3fb950; --off: #6e7681; --bad: #f85149;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --card: #fff; --line: #e2e5ea;
    --fg: #1b1f24; --muted: #6b7280;
    --on: #1a7f37; --off: #9aa0a6; --bad: #cf222e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1rem; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, "Microsoft YaHei", sans-serif;
}
h1 { font-size: 1.15rem; margin: 0; }
h2 { font-size: .95rem; margin: 0; }
.err { color: var(--bad); margin: .5rem 0; font-size: .85rem; min-height: 1.2em; }
#tick { color: var(--muted); font-size: .8rem; }

#login { display: flex; min-height: 80vh; align-items: center; justify-content: center; }
#loginForm {
  width: min(320px, 100%); padding: 1.5rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
}
#loginForm h1 { margin-bottom: 1rem; }
input, button {
  font: inherit; border-radius: 6px; border: 1px solid var(--line);
}
input {
  width: 100%; padding: .55rem .7rem; background: var(--bg); color: var(--fg);
}
button {
  padding: .4rem .75rem; background: var(--accent); color: #fff;
  border-color: transparent; cursor: pointer;
}
#loginForm button { width: 100%; margin-top: .75rem; padding: .55rem; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }

#app { max-width: 950px; margin: 0 auto; }
#app > header, #logs > header {
  display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem;
}
#logout, #closeLogs { margin-left: auto; }
table {
  width: 100%; border-collapse: collapse; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
th, td { padding: .6rem .7rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .78rem; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
tr.busy { opacity: .5; }
td.name { white-space: normal; }
td.name small { display: block; color: var(--muted); font-size: .75rem; }
td.ops { display: flex; flex-wrap: wrap; gap: .35rem; }
.dot {
  display: inline-block; width: .6rem; height: .6rem; margin-right: .45rem;
  border-radius: 50%; background: var(--off);
}
.dot.on { background: var(--on); }
.dot.bad { background: var(--bad); }

#logs { margin-top: 1.25rem; }
#logBody {
  margin: 0; max-height: 55vh; overflow: auto; padding: .7rem;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
@media (max-width: 640px) {
  body { padding: .6rem; }
  th, td { padding: .5rem .45rem; font-size: .85rem; }
  th:nth-child(4), td:nth-child(4) { display: none; }
}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>项目面板</h1>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button id="loginBtn">登录</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <h1>项目面板</h1>
    <span id="tick"></span>
    <button id="logout" class="ghost">退出</button>
  </header>

  <p id="banner" class="err" hidden></p>

  <table>
    <thead>
      <tr><th>项目</th><th>状态</th><th>运行时长</th><th>CPU</th><th>内存</th><th>操作</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <section id="logs" hidden>
    <header>
      <h2>日志 · <span id="logName"></span></h2>
      <button id="closeLogs" class="ghost">关闭</button>
    </header>
    <pre id="logBody"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const POLL = 3000;
let timer = null, logKey = null;

async function req(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('未登录'); }
  if (!r.ok) throw new Error((await r.text()).trim() || 'HTTP ' + r.status);
  return r;
}

function banner(msg) {
  $('banner').textContent = msg || '';
  $('banner').hidden = !msg;
}

function showLogin() {
  clearInterval(timer);
  timer = null;
  logKey = null;
  banner('');
  $('logs').hidden = true;
  $('app').hidden = true;
  $('login').hidden = false;
  $('pw').focus();
}

function showApp() {
  $('login').hidden = true;
  $('app').hidden = false;
  refresh();
  timer ||= setInterval(refresh, POLL);
}

function fmtDur(s) {
  if (s == null) return '—';
  s = Math.floor(s);
  const d = s / 86400 | 0, h = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0;
  return d ? `${d}天 ${h}小时` : h ? `${h}小时 ${m}分` : m ? `${m}分 ${s % 60}秒` : `${s}秒`;
}

function fmtMem(b) {
  if (b == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + u[i];
}

// 全程用 textContent 建 DOM，不拼 innerHTML，就不用操心转义
function cell(tr, text) {
  const td = document.createElement('td');
  td.textContent = text;
  tr.appendChild(td);
  return td;
}

function render(list) {
  $('rows').replaceChildren(...list.map(u => {
    const running = u.active === 'active';
    const tr = document.createElement('tr');

    const name = cell(tr, u.name);
    name.className = 'name';
    const small = document.createElement('small');
    small.textContent = [u.unit, u.pid ? 'pid ' + u.pid : '', u.enabled ? '开机自启' : '']
      .filter(Boolean).join(' · ');
    name.appendChild(small);

    const st = cell(tr, !u.loaded ? 'unit 不存在'
      : running ? '运行中' : u.active === 'failed' ? '失败' : '已停止');
    const dot = document.createElement('span');
    dot.className = 'dot ' + (running ? 'on' : u.active === 'failed' ? 'bad' : 'off');
    st.prepend(dot);
    st.title = `${u.active} / ${u.sub}`;   // 悬停能看到 systemd 的原始状态

    cell(tr, fmtDur(u.uptime));
    cell(tr, u.cpu == null ? '—' : u.cpu.toFixed(1) + '%');
    cell(tr, fmtMem(u.memory));

    const ops = cell(tr, '');
    ops.className = 'ops';
    for (const [act, label] of [['start', '启动'], ['stop', '停止'], ['restart', '重启']]) {
      const b = document.createElement('button');
      b.textContent = label;
      b.disabled = !u.loaded || (act === 'start' && running) || (act === 'stop' && !running);
      b.onclick = () => doAction(u, act, label, tr);
      ops.appendChild(b);
    }
    const lb = document.createElement('button');
    lb.textContent = '日志';
    lb.className = 'ghost';
    lb.onclick = () => openLogs(u);
    ops.appendChild(lb);

    return tr;
  }));
}

async function doAction(u, act, label, tr) {
  if (act !== 'start' && !confirm(`确认${label}「${u.name}」?`)) return;
  tr.classList.add('busy');
  tr.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await req(`/api/units/${u.key}/${act}`, { method: 'POST' });
    banner('');
  } catch (e) {
    if (e.message !== '未登录') banner(`${label}「${u.name}」失败: ${e.message}`);
  }
  refresh();
}

function openLogs(u) {
  logKey = u.key;
  $('logName').textContent = u.name;
  $('logs').hidden = false;
  $('logBody').textContent = '加载中…';
  loadLogs(true);
}

async function loadLogs(jump) {
  if (!logKey) return;
  try {
    const text = await (await req(`/api/units/${logKey}/logs?lines=300`)).text();
    const p = $('logBody');
    const atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
    p.textContent = text.trim() || '(暂无日志)';
    if (jump || atBottom) p.scrollTop = p.scrollHeight;   // 只在贴着底部时才跟随
  } catch { /* 401 已由 req() 处理 */ }
}

async function refresh() {
  if (document.hidden) return;   // 后台标签页不用白跑
  try {
    render(await (await req('/api/units')).json());
    $('tick').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    if ($('banner').textContent.startsWith('刷新失败')) banner('');
    await loadLogs(false);
  } catch (e) {
    if (e.message !== '未登录') banner('刷新失败: ' + e.message);
  }
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    });
    if (!r.ok) { $('loginErr').textContent = (await r.text()).trim() || '登录失败'; return; }
    $('pw').value = '';
    showApp();
  } catch {
    $('loginErr').textContent = '连不上服务器';
  } finally {
    $('loginBtn').disabled = false;
  }
};

$('logout').onclick = async () => {
  try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
  showLogin();
};

$('closeLogs').onclick = () => { logKey = null; $('logs').hidden = true; };

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

fetch('/api/me', { credentials: 'same-origin' })
  .then(r => r.ok ? showApp() : showLogin())
  .catch(showLogin);
</script>
</body>
</html>
