[package]
name = "panel"
version = "0.1.0"
edition = "2024"

[dependencies]
# ws：网页版控制台的 WebSocket 升级要用这个 feature
axum = { version = "0.8.1", features = ["ws"] }
tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "sync",
] }
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.8.19"
getrandom = "0.3.1"
# 网页控制台：给 ssh 分配一个 PTY，交互程序（密码提示、vim、top）才能正常跑。
# 选跨平台的 portable-pty 而不是 unix-only libc，是为了能在 Windows 开发机上编译验证。
portable-pty = "0.9"
# 拆分 WebSocket 的 Sink/Stream，收发两头并发（axum 已传递依赖它）
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
